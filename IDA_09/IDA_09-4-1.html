<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Grid Layout</title>
    <style>
        .container {
            display: grid;
        }
        .item {color: white;}
        .itemA {background-color: red;}
        .itemB {background-color: green;}
        .itemC {background-color: blue;}
    </style>
</head>
<body>
    <div class="container">
        <div class="item itemA">A</div>
        <div class="item itemB">B</div>
        <div class="item itemC">C</div>
    </div>
</body>
</html>
