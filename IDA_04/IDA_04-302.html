
<!DOCTYPE html>
<html>
    <head>
        <title>Canvas Test</title>
        <script>
            //canvasの中身を指し示すもの
            let ctx;
            //canvas の width 幅
            let cw;
            //canvas の height 高さ
            let ch;
            //パーティクルの準備
            const density = 100; //パーティクルの密度
            let particles = [];
            
            //初期化処理
            function init(){
                //ID が mycanvas のものを canvas という変数にいれておく
                let canvas = document.getElementById('mycanvas');
                //canvas が存在しないか、 canvas の中身が無ければ処理終了
                if(!canvas  ||!canvas.getContext){
                    return false;
                }

                //canvas の中を指し示すものを代入
                ctx = canvas.getContext('2d');
                //canvas の幅、高さを代入しておく
                cw = canvas.width;
                ch = canvas.height;

                //円の初期化
                for(let i=0;i < density; i++){
                    particles[i] = new Particle(getRandomScale(), "rgba("+getRandomColor()+","+getRandomColor()+","+getRandomColor()+","+getRandomAlpha()+")", 5, 1, 0.4);
                    particles[i].position.x = Math.random()*ch;
                    particles[i].position.y = Math.random()*cw;
                    particles[i].draw();
                }
                
                //実際の描画処理
                draw();

                //一定時間ごとに書き換える
                setInterval("draw()",33);
            }

            //Particle クラス
            class Particle {
                constructor(scale, color, vx, vy, gv){
                    this.scale = scale;
                    this.color = color;
                    this.vx = vx;
                    this.vy = vy;
                    this.gv = gv;
                    this.position = {
                        x: 100,
                        y: 100
                    };
                }
                draw(){
                    ctx.beginPath();
                    ctx.arc(this.position.x, this.position.y, this.scale, 0, 2*Math.PI, false);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                update(){
                    this.vy += this.gv;
                    this.position.x += this.vx;
                    this.position.y += this.vy;
                    this.draw();
                }
            }
            
            function draw(){
                //画面をリセットする
                ctx.fillStyle = "rgba(255,255,255,1)";
                ctx.fillRect(0,0,cw,ch);

                //円の描画
                for(let i=0;i < density; i++){
                    particles[i].update();
                }
            }

            function getRandomColor(){
                return Math.floor(Math.random()*255);
            }
            function getRandomAlpha(){
                return Math.random();
            }
            function getRandomScale(){
                return (Math.random()*(8-3))+3;
            }
        </script>
    </head>
    <body onload="init();">
        <h1>Canvas Test</h1>
        <canvas id="mycanvas" width="1000" height="800"></canvas>    
    </body>
</html>
