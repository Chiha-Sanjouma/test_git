<!DOCTYPE html>
<html lang="ja">
<head>
</head>
<body>
    <script type="text/javascript">
        function primenumber(n){
            let i= 1;
            while(i++ < n){
                document.write(i+", "+n+"<br/>");
                if(n % i != 0){
                    document.write("割り切れない<br/>");
                } else {
                    document.write("割り切れる<br/>");
                    break;
                }
            }
            if(i == n){
                document.write("素数！<br/>");
            } else {
                document.write("素数でない！<br/>");
            }
        }
        primenumber(49)
    </script>
</body>
</html>
