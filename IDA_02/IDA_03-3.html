<!DOCTYPE html>
<html lang="ja">
<head>
</head>
<body>
    <script type="text/javascript">
        function primenumber(n){
            let i= 1;
            while(i++ < n){
                //document.write(i+", "+n+"<br/>");
                if(n % i != 0){
                    //document.write("割り切れない<br/>");
                } else {
                    //document.write("割り切れる<br/>");
                    break;
                }
            }
            if(i == n){
                return 1;//素数
            } else {
                return 0;//素数でない
            }
        }
        document.write(primenumber(1))
        function primenumberlist(n){
            document.write(n+"までの素数は<br/>");
            for(let i=2; i<n; i++){//素数はiを除外するため
                if(primenumber(i)==1){
                    document.write(i+" ");
                }
            }
            document.write("<br/>です。")
        }
        primenumberlist(1000);
    </script>
</body>
</html>
