<body>
    <script type="text/javascript">
        let i;
        for(i=1;i<10;i++){
            if(i%2==0){
                continue;
            }
            document.write(i+"<br/>");
        }
        for(i=1;i<10;i++){
            if(i==5){
                break;
            }
            document.write(i+"<br/>");
        }
    </script>
